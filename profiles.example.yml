# DBT Fundamentals Course
jaffle_shop:
  target: dev
  outputs:
    dev:
      type:  bigquery # We are using BigQuery for this course, but dbt supports many other data warehouses as well.
      method: service-account # We are using a service account for authentication, but dbt supports other methods as well.
      project: YOUR-DEV-PROJ # The project ID for your BigQuery project. You can find this in the Google Cloud Console.
      dataset: YOUR-DEV-DATASET # The dataset in your BigQuery project where dbt will create tables and views. You can find this in the Google Cloud Console.
      keyfile: /path/to/creds.json # The path to your service account key file. You can download this from the Google Cloud Console.
      threads: 4
      location: US

      # ### for python models
      # compute_region: YOURE-REGION
      # gcs_bucket: YOUR-DEV-BUCKET
      # network: default
