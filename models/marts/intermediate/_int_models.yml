version: 2

models:
  - name: int_customer_orders
    config:
      contract:
        enforced: true
    description: ""
    columns:
      - name: order_id
        data_type: string
        constraints:
          - type: not_null
        description: ""

      - name: customer_id
        data_type: string
        description: ""
        # data_tests:
        #   - dbt_utils.cardinality_equality:
        #       arguments:
        #         to: ref('stg_jaffle_shop__orders')
        #         field: customer_id
          

      - name: ordered_at
        data_type: datetime
        description: ""

      - name: order_total_amount_paid
        data_type: float64
        description: ""
        data_tests:
          - assert_amount_average_is_greater_than_one:
              arguments:
                group_by_column: customer_id
                column_name: order_total_amount_paid

      - name: order_finalized_date
        data_type: datetime
        description: ""

      - name: customer_most_recent_order_date
        data_type: datetime
        description: ""

      - name: customer_lifetime_order_count
        data_type: int64
        description: ""

      - name: transaction_seq
        data_type: int64
        description: ""

      - name: customer_sales_seq
        data_type: int64
        description: ""

      - name: customer_lifetime_value
        data_type: float64
        description: ""

      - name: customer_first_order_date
        data_type: datetime
        description: ""

      - name: customer_avg_non_returned_order_value
        data_type: float64
        description: ""