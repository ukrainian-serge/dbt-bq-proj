version: 2

models:
  - name: int_customer_orders
    config:
      contract:
        enforced: true
        
    description: "Intermediate fact table combining order-level transactions with customer lifetime metrics."
    columns:
      - name: order_id
        data_type: string
        constraints:
          - type: not_null
          - type: primary_key
            warn_unenforced: false

        description: "Unique identifier for each customer order. Primary key for this fact table."

      - name: customer_id
        data_type: string
        constraints:
          - type: not_null
        description: "Unique identifier for the customer who placed the order."

        data_tests:
          - dbt_utils.cardinality_equality:
              arguments:
                to: ref('stg_jaffle_shop__orders')
                field: customer_id
              config:
                severity: warn
                error_if: ">=100"

        # data_tests:
        #   - unique

      - name: ordered_at
        data_type: datetime
        description: "Timestamp when the customer placed the order. Used as event_time for partitioning."

      - name: order_total_amount_paid
        data_type: float64
        description: "Total monetary amount paid for the order across all items."
        data_tests:
          - assert_amount_average_is_greater_than_one:
              arguments:
                group_by_column: customer_id
                column_name: order_total_amount_paid
              config:
                # where: " customer_most_recent_order_date = current_date() "
                severity: warn
                error_if: ">=100"
                store_failures: true

                
      - name: order_finalized_date
        data_type: datetime
        description: "The date when the order was finalized and completed."

      - name: customer_most_recent_order_date
        data_type: datetime
        description: "The most recent order date for this customer at the time of this order."

      - name: customer_lifetime_order_count
        data_type: int64
        description: "Total number of orders placed by this customer throughout their relationship."

      - name: transaction_seq
        data_type: int64
        description: "Global sequential transaction number across all orders and customers."

      - name: customer_sales_seq
        data_type: int64
        description: "Customer-specific order sequence number indicating the position in customer order history."

      - name: customer_lifetime_value
        data_type: float64
        description: "Cumulative revenue generated by the customer from their first order through this order."

      - name: customer_first_order_date
        data_type: datetime
        description: "The date of this customer's very first order."

      - name: customer_avg_non_returned_order_value
        data_type: float64
        description: "Average order value for this customer calculated by dividing cumulative lifetime value by order count."