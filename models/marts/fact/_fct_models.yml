version: 2

models:
  - name: fct_customer_orders
    description: Fact table containing customer order details with incremental microbatch materialization
    config:
      access: public
      group: product
      contract:
        enforced: true
      unique_key: order_id
      partition_by:
        field: order_placed_at
        data_type: datetime
        granularity: day

    versions:
      - v: 1
        config:
          alias: fct_customer_orders_v1
        columns:
          - name: order_id
            data_type: string
            constraints:
              - type: not_null
          - name: customer_id
            data_type: string
          - name: order_placed_at
            data_type: datetime
          - name: total_amount_paid
            data_type: float64
          - name: payment_finalized_date
            data_type: datetime
          - name: customer_first_name
            data_type: string
          - name: customer_last_name
            data_type: string
          - name: transaction_seq
            data_type: int64
          - name: customer_sales_seq
            data_type: int64
          - name: customer_lifetime_value
            data_type: float64
          - name: fdos
            data_type: datetime
          - name: nvsr
            data_type: string

      - v: 2
        config:
          alias: fct_customer_orders_v2
        columns:
          - name: fdos
            data_type: date
          - name: payment_finalized_date
            data_type: date
          - include: all
            exclude: [transaction_seq]