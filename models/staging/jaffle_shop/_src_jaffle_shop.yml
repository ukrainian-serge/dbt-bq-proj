version: 2

sources:
  - name: jaffle_shop
    description: Upload using jaffle-raw-data/load_data.py, which loaded to BQ
    database: raw-data-503215   # The Project ID
    schema: jaffle_shop         # The Dataset name

    tables:
      - name: customers
        identifier: customers
        columns:
          - name: id # changed to customer_id in stg model
            description: primary key for this source
            data_tests:
              - not_null
              - unique
          - name: name
            description: first and last name
            data_type: string
            data_tests:
              - not_null

      - name: items
        columns:
          - name: id
            data_type: string
            data_tests:
              - not_null
              - unique
          - name: order_id
            data_type: string
            data_tests:
              - not_null
          - name: sku
            data_type: string
            data_tests:
              - not_null

      - name: orders
        columns:
          - name: id
            data_type: string
            data_tests:
              - not_null
              - unique
        
          - name: customer
            data_type: string
          - name: ordered_at
            data_type: string
          - name: store_id
            data_type: string
            data_tests:
              - not_null
          - name: subtotal
            data_type: string
            data_tests:
              - not_null
          - name: tax_paid
            data_type: string
            data_tests:
              - not_null
          - name: order_total
            data_type: string

      - name: products
        columns:
          - name: sku
            data_type: string
            description: primary key for this source
            data_tests:
              - not_null
              - unique
          - name: name
            data_type: string
          - name: type
            data_type: string
            data_tests:
              - not_null
          - name: price
            data_type: string
            data_tests:
              - not_null
          - name: description
            data_type: string

      - name: stores
        columns:
          - name: id
            data_type: string
            data_tests:
              - not_null
              - unique
          - name: name
            data_type: string
          - name: opened_at
            data_type: string
          - name: tax_rate
            data_type: string
            data_tests:
              - not_null

      - name: supplies
        columns:
          - name: id
            data_type: string
            data_tests:
              - not_null
          - name: name
            data_type: string
          - name: cost
            data_type: string
          - name: perishable
            data_type: string
          - name: sku
            data_type: string
            data_tests:
              - not_null

      - name: tweets
        columns:
          - name: id
            data_type: string
            data_tests:
              - not_null
              - unique
          - name: user_id
            data_type: string
            data_tests:
              - not_null
          - name: tweeted_at
            data_type: string
          - name: content
            data_type: string