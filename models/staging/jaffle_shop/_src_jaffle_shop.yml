version: 2

sources:
  - name: jaffle_shop
    description: Clone from Google Big Query public dataset `jaffle_shop` for dbt demo
    database: raw-data-503215   # The Project ID
    schema: jaffle_shop         # The Dataset name
    tables:
      - name: customers
        identifier: customers
        description: Raw data
        columns:
          - name: id # changed to customer_id in stg model
            description: primary key for this source
            data_tests:
              - not_null
              - unique


  
      - name: orders
        config:
          freshness:
            warn_after: {count: 24, period: hour}
            # error_after: {count: 48, period: hour}

          loaded_at_field: _etl_loaded_at
