models:
  - name: stg_jaffle_shop__customers
    description: Staging layer for Jaffle Shop customers data
    columns:
      - name: customer_id
        description: Unique identifier for the customer
        data_tests:
          - unique
          - not_null
      - name: first_name
        description: Customer's first name
      - name: last_name
        description: Customer's last name

  - name: stg_jaffle_shop__orders
    description: Staging layer for Jaffle Shop orders data
    columns:
      - name: order_id
        description: Unique identifier for the order
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: Customer identifier
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_jaffle_shop__customers')
                field: customer_id
      - name: order_date
        description: Date of the order
      - name: status
        description: Order status
        data_tests:
          - accepted_values:
              arguments:
                values: [
                    'placed', 
                    'shipped', 
                    'completed', 
                    'returned', 
                    'return_pending'
                    ]